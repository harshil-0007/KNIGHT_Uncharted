<style>
:root{--bg:#e6eff2;--sf:#f8fbfc;--sf2:#d9e7ec;--ln:#bfd3da;--fg:#08202e;--mu:#476476;--ac:#0a5bd6;--acf:#fff;--crit:#c4163a;--high:#b8500a;--med:#8a6a00;--low:#4a6a82;--ok:#0f7a4d;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;--disp:"Playfair Display",Georgia,"Times New Roman",serif;--body:"Source Sans 3",system-ui,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05141c;--sf:#0a1f29;--sf2:#102c39;--ln:#1b3d4e;--fg:#e4f0f4;--mu:#8fb0bf;--ac:#5cc4ff;--acf:#04141c;--crit:#ff7088;--high:#ffa060;--med:#f0c85a;--low:#98b4c6;--ok:#52d894;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#05141c;--sf:#0a1f29;--sf2:#102c39;--ln:#1b3d4e;--fg:#e4f0f4;--mu:#8fb0bf;--ac:#5cc4ff;--acf:#04141c;--crit:#ff7088;--high:#ffa060;--med:#f0c85a;--low:#98b4c6;--ok:#52d894;color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg) repeating-radial-gradient(circle at 92% -8%,transparent 0 58px,color-mix(in srgb,var(--ac) 9%,transparent) 58px 59px);background-attachment:fixed;color:var(--fg);font:15.5px/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
header .wrap{display:flex;align-items:center;gap:14px;min-height:60px;flex-wrap:wrap}

nav{display:flex;gap:2px;overflow-x:auto;padding:3px;border:1px solid var(--ln);border-radius:99px;background:var(--sf)}
nav a{padding:6px 14px;border-radius:99px;color:var(--mu);text-decoration:none;font-weight:600;font-size:13.5px;white-space:nowrap;transition:background .2s,color .2s}
nav a:hover{color:var(--fg)}
nav a.on{background:var(--ac);color:var(--acf)}
h2{margin:30px 0 6px;font:800 1.9rem/1.1 var(--disp);letter-spacing:-.025em}
p{margin:0;max-width:72ch}.mu{color:var(--mu)}
code{font:12.5px var(--mono);background:var(--sf2);padding:1px 6px;border-radius:5px}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:20px;margin-top:16px;min-width:0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.btn{font:700 13.5px var(--body);padding:10px 16px;border-radius:99px;border:1px solid var(--ln);background:var(--sf);color:var(--fg);cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
.btn:hover{border-color:var(--ac);transform:translateY(-1px)}
.btn.p{background:var(--ac);color:var(--acf);border-color:var(--ac)}
.btn.p:hover{box-shadow:0 0 0 5px color-mix(in srgb,var(--ac) 22%,transparent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
textarea,select,input[type=text]{width:100%;font:13px/1.55 var(--mono);color:var(--fg);background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:11px 13px;transition:border-color .2s,box-shadow .2s}
select,input[type=text]{font-family:var(--body);font-size:14.5px}
textarea:focus,select:focus,input:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 20%,transparent)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
th{text-align:left;font-size:12px;font-weight:700;color:var(--mu);padding:0 10px 10px}
td{padding:12px 10px;border-top:1px solid var(--ln);vertical-align:top}
tbody tr{transition:background .15s}tbody tr:hover{background:color-mix(in srgb,var(--ac) 6%,transparent)}
.m{font-family:var(--mono);font-size:12px;word-break:break-all;color:var(--mu)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap;background:color-mix(in srgb,currentColor 14%,transparent)}
.critical{color:var(--crit)}.high{color:var(--high)}.medium{color:var(--med)}.low{color:var(--low)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:18px}
.kpis div{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:16px 18px}
.kpis b{display:block;font:800 3rem/1 var(--disp);letter-spacing:-.04em}
.kpis div:nth-child(3) b{color:var(--crit)}
.sev{margin-top:16px}
.sev .bar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--sf2);gap:2px}

<script>
const SEV={critical:4,high:3,medium:2,low:1};
const READABLE=/\.(py|js|ts|tsx|jsx|mjs|cjs|json|env|ya?ml|toml|md|txt|html|css|go|rb|java|rs)$/i;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const KEYS=[
 ['Stripe live secret key','critical',/\bsk_live_[0-9a-zA-Z]{24,}\b/g,0,'Roll the key in the Stripe dashboard, then load the new one from an environment variable.'],
 ['AWS access key ID','critical',/\b(?:AKIA|ASIA)[0-9A-Z]{16}\b/g,0,'Deactivate it in IAM, create a new key, and read it from the environment.'],
 ['Database URL with password','critical',/\b(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis):\/\/[^\s:@\/'"]+:([^\s@\/'"]{4,})@[^\s'"]+/g,1,'Change the database password and keep the URL in an environment variable.'],
 ['Private key block','critical',/-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----/g,0,'Generate a new key pair and remove the old public key everywhere.'],
 ['GitHub token','high',/\bgh[pousr]_[A-Za-z0-9]{36}\b/g,0,'Delete the token in GitHub settings and create one with fewer permissions.'],
 ['Slack token','high',/\bxox[baprs]-[A-Za-z0-9-]{10,48}\b/g,0,'Revoke it in the Slack app settings and install again.'],
 ['SendGrid API key','high',/\bSG\.[A-Za-zA-Z0-9_-]{22}\.[A-Za-zA-Z0-9_-]{43}\b/g,0,'Delete it in SendGrid and create a replacement.'],
 ['Google API key','medium',/\bAIza[0-9A-Za-z_-]{35}\b/g,0,'Regenerate it and restrict it by referrer or IP.']
];
const GENERIC=/\b([A-Za-z_]\w*(?:secret|token|passw(?:or)?d|api[_-]?key)\w*)\s*[:=]\s*["']([^"'\s]{12,})["']/gi;
function entropy(s){const f={};for(const c of s)f[c]=(f[c]||0)+1;return -Object.values(f).reduce((a,n)=>a+n/s.length*Math.log2(n/s.length),0)}
const mask=v=>v.length>10?v.slice(0,4)+'••••'+v.slice(-3):v.slice(0,2)+'••••';

const RULES=[
 ['Runs dynamic code (eval/exec)','high',/\b(?:eval|exec)\s*\(/,'Never run text from users. Use a parser or a lookup table.'],
 ['SQL built from strings','high',/\b(?:execute|query)\s*\(\s*(?:f["']|["'][^"']*["']\s*(?:%|\+))/,'Use placeholders and pass values separately.'],
 ['HTTPS check turned off','high',/verify\s*=\s*False|rejectUnauthorized\s*:\s*false/,'Remove it. Trust the real certificate instead.'],
 ['Unsafe pickle or YAML load','high',/pickle\.loads?\s*\(|yaml\.load\s*\((?![^)]*Loader)/,'Use json or yaml.safe_load.'],
 ['Shell command with shell=True','high',/shell\s*=\s*True/,'Pass a list of arguments and drop shell=True.'],
 ['Debug mode on','medium',/\bdebug\s*=\s*True\b/,'Read it from the environment and keep it off in production.'],
 ['Weak hash (MD5 or SHA-1)','medium',/hashlib\.(?:md5|sha1)\b|\b(?:md5|sha1)\s*\(/i,'Use bcrypt, scrypt or argon2 for passwords, SHA-256 for checksums.'],
 ['CORS allows every origin','medium',/origin\s*:\s*["']\*["']|Allow-Origin["'],?\s*["']\*/i,'List the exact origins that need access.'],
 ['Raw HTML insertion (XSS risk)','medium',/\.innerHTML\s*=|dangerouslySetInnerHTML/,'Use textContent, or sanitise the HTML first.']
];
function scanLine(text,path,line){
 const out=[];
 for(const [name,sev,re,g,fix] of KEYS){
  for(const m of text.matchAll(re)){const v=g?m[g]:m[0];out.push({kind:'key',name,sev,path,line,shown:mask(v),fix,fp:name+v})}
 }
 if(!out.length&&!/os\.environ|process\.env|getenv/.test(text)){
  for(const m of text.matchAll(GENERIC)){
   if(entropy(m[2])<3||/^(password|changeme|example|your[_-].*)$/i.test(m[2]))continue;
   out.push({kind:'key',name:'Hard-coded credential: '+m[1],sev:'high',path,line,shown:mask(m[2]),fix:'Move the value to an environment variable and rotate it.',fp:m[2]});
  }
 }
 for(const [name,sev,re,fix] of RULES) if(re.test(text)) out.push({kind:'issue',name,sev,path,line,shown:text.trim().slice(0,70),fix,fp:name+path+line});
 return out;
}

function parseFns(path,text){
 const L=text.split('\n'),out=[],py=/\.py$/.test(path);
 L.forEach((l,i)=>{
  if(py){
   const m=l.match(/^(\s*)(?:async\s+)?def\s+(\w+)\s*\(/);if(!m)return;
   let e=i;for(let j=i+1;j<L.length;j++){if(!L[j].trim()||/^\s*#/.test(L[j]))continue;if(L[j].match(/^\s*/)[0].length<=m[1].length)break;e=j}
   out.push({path,name:m[2],start:i+1,end:e+1});
  }else{
   const m=l.match(/^\s*(?:export\s+)?(?:async\s+)?function\s+(\w+)\s*\(/)||l.match(/^\s*(?:export\s+)?(?:const|let)\s+(\w+)\s*=\s*(?:async\s*)?(?:function\b|\([^)]*\)\s*=>|\w+\s*=>)/);
   if(!m)return;
   let d=0,seen=false,e=i;
   for(let j=i;j<L.length;j++){for(const c of L[j]){if(c==='{'){d++;seen=true}else if(c==='}')d--}e=j;if(seen&&d<=0)break;if(!seen&&j>i+1&&!/=>\s*$/.test(L[j-1]))break}
   out.push({path,name:m[1],start:i+1,end:e+1});
  }
 });
 return out;
}
const isTest=p=>/(^|\/)(tests?|__tests__)\/|(^|\/)test_|\.(test|spec)\.|_test\./.test(p);

function analyze(files){
 const fns=[],findings=[],lines={};
 for(const [p,t] of Object.entries(files)){
  lines[p]=t.split('\n');
  fns.push(...parseFns(p,t));
  lines[p].forEach((l,i)=>findings.push(...scanLine(l,p,i+1)));
 }
 fns.forEach(f=>{f.id=f.path+'::'+f.name;f.callers=[];f.test=isTest(f.path)});
 const byId=new Map(fns.map(f=>[f.id,f]));
 for(const f of fns){
  const body=lines[f.path].slice(f.start,f.end).join('\n');
  for(const g of fns){
   if(g===f||g.name===f.name)continue;
   if(new RegExp('\\b'+g.name+'\\s*\\(').test(body)&&!g.callers.includes(f))g.callers.push(f);
  }
 }
 const inner=(p,ln)=>fns.filter(f=>f.path===p&&ln>=f.start&&ln<=f.end).sort((a,b)=>(a.end-a.start)-(b.end-a.start))[0];
 findings.forEach(x=>{const f=inner(x.path,x.line);x.fn=f?f.id:null});
 const seen=new Set();
 const uniq=findings.filter(x=>{
  if(x.kind!=='key')return true;
  if(seen.has(x.fp))return false;
  seen.add(x.fp);
  return true;
 });
 uniq.sort((a,b)=>SEV[b.sev]-SEV[a.sev]);
 return {files,fns,byId,findings:uniq,inner};
}
function impact(M,ids){
 const hops=new Map();let fr=[...ids],h=0;const seen=new Set(ids);
 while(fr.length){h++;const nx=[];for(const id of fr)for(const c of M.byId.get(id).callers)if(!seen.has(c.id)){seen.add(c.id);hops.set(c.id,h);nx.push(c.id)}fr=nx}
 return hops;
}
const covered=(M,id,hops)=>M.byId.get(id).test||[...hops.keys()].some(k=>M.byId.get(k).test);

function diffFileNames(text){
 const files=[];
 for(const l of text.split('\n')){
  const m=l.match(/^\+\+\+ (?:b\/)?(.+)$/);
  if(m&&m[1]!=='/dev/null')files.push(m[1].trim());
 }
 return files;
}
function readablePath(p){
 const base=p.split(/[/\\]/).pop();
 return READABLE.test(p)||/^\.env(?:\..+)?$/.test(base);
}
function inspectFiles(files){
 const paths=Object.keys(files||{});
 if(!paths.length)return {error:'incomplete_input',message:'No files to scan. Paste code with ### path/file.py lines, or choose files.'};
 const bad=paths.find(p=>!readablePath(p));
 if(bad){
  const ext=(bad.match(/\.[^.]+$/)||['this type'])[0];
  return {error:'invalid_configuration',message:`DBug cannot read ${ext} files (${bad}). Use source files such as .py, .js, .ts, or .env.`};
 }
 return {ok:true};
}
function inspectDiff(text){
 if(!String(text).trim())return {error:'incomplete_input',message:'Paste a git diff before checking a change.'};
 const files=diffFileNames(text);
 if(!files.length)return {error:'incomplete_input',message:'This diff has no file names. Use git diff output that includes lines like +++ b/path/to/file.py.'};
 const bad=files.find(p=>!readablePath(p));
 if(bad){
  const ext=(bad.match(/\.[^.]+$/)||['this type'])[0];
  return {error:'invalid_configuration',message:`DBug cannot read ${ext} files (${bad}). Point the change at source files it can parse.`};
 }
 return {ok:true,files};
}

function applyUnifiedDiff(files,text){
 const next=Object.fromEntries(Object.entries(files).map(([p,t])=>[p,t.split('\n')]));
 const rows=text.split('\n');
 let file=null,i=0;
 while(i<rows.length){
  const l=rows[i];
  if(l.startsWith('+++ ')){
   const m=l.match(/^\+\+\+ (?:b\/)?(.+)$/);
   file=m&&m[1]!=='/dev/null'?m[1].trim():null;
   if(file&&!next[file])next[file]=[''];
   i++;continue;
  }
  const h=l.match(/^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@/);
  if(h&&file){
   const oldStart=+h[1],oldCount=h[2]===undefined?1:+h[2];
   const remove=[],add=[];
   i++;
   while(i<rows.length){
    const row=rows[i];
    if(/^@@ |^diff |^\+\+\+ |^--- /.test(row))break;
    if(row.startsWith('\\')){i++;continue}
    if(row.startsWith('+'))add.push(row.slice(1));
    else if(row.startsWith('-'))remove.push(row.slice(1));
    else {const body=row.startsWith(' ')?row.slice(1):row;add.push(body);remove.push(body)}
    i++;
   }
   const arr=next[file];
   const at=oldCount===0?oldStart:oldStart-1;
   arr.splice(at,remove.length||oldCount,...add);
   continue;
  }
  i++;
 }
 const out={};
 for(const [p,arr] of Object.entries(next)){
  let s=arr.join('\n');
  if(!s.endsWith('\n'))s+='\n';
  out[p]=s;
 }
 return out;
}

function checkDiff(M,text){
 let file=null,ln=0;const added=[],touched=new Map();
 const mark=(f,n)=>{if(!touched.has(f))touched.set(f,new Set());touched.get(f).add(n)};
 for(const l of text.split('\n')){
  if(l.startsWith('+++ ')){const m=l.match(/^\+\+\+ (?:b\/)?(.+)$/);file=m&&m[1]!=='/dev/null'?m[1].trim():null;continue}
  if(/^(--- |diff |index |new file|deleted file)/.test(l))continue;
  const h=l.match(/^@@ -\d+(?:,\d+)? \+(\d+)/);if(h){ln=+h[1]-1;continue}
  if(!file)continue;
  if(l.startsWith('+')){ln++;added.push({file,line:ln,text:l.slice(1)});mark(file,ln)}
  else if(l.startsWith('-'))mark(file,Math.max(1,ln+1));
  else ln++;
 }
 const finds=added.flatMap(a=>scanLine(a.text,a.file,a.line)).sort((a,b)=>SEV[b.sev]-SEV[a.sev]);
 const changed=new Set();
 for(const [f,set] of touched)for(const n of set){const fn=M.files[f]!==undefined?M.inner(f,n):null;if(fn)changed.add(fn.id)}
 const ids=[...changed],hops=impact(M,ids);
 const rows=ids.map(id=>{const own=impact(M,[id]);return {id,size:own.size,tested:covered(M,id,own)}});
 let verdict='pass';
 if(finds.length||rows.some(r=>!r.tested)||hops.size>=5)verdict='warn';
 if(finds.some(f=>SEV[f.sev]>=3))verdict='block';
 const applied=added.length>0&&added.filter(a=>((M.files[a.file]||'').split('\n')[a.line-1]||'').trimEnd()===a.text.trimEnd()).length/added.length>=0.8;
 return {finds,ids,hops,rows,verdict,files:[...touched.keys()],applied};
}

const toSrc=f=>Object.entries(f).map(([p,t])=>'### '+p+'\n'+t.replace(/\n$/,'')).join('\n\n');
function fromSrc(s){const f={};let cur=null;for(const l of s.split('\n')){const m=l.match(/^### (\S.*)$/);if(m){cur=m[1].trim();f[cur]=[];}else if(cur)f[cur].push(l)}
 for(const k in f)f[k]=f[k].join('\n').replace(/\n+$/,'')+'\n';return f}
function scan(){S.M=analyze(fromSrc(S.src));if(!S.M.byId.has(S.fn))S.fn=null}
const pill=s=>`<span class="pill ${s}">${s[0].toUpperCase()+s.slice(1)}</span>`;

function table(list){

}

function toast(msg){
 const el=$('#toast');el.hidden=false;el.textContent=msg;clearTimeout(toast.t);toast.t=setTimeout(()=>{el.hidden=true},4200);
}
async function api(path,opts){
 const res=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});
 const data=await res.json().catch(()=>({}));
 if(!res.ok){const err=new Error(data.message||res.statusText);err.payload=data;err.status=res.status;throw err}
 return data;
}
async function refreshHealth(){

}
async function saveRun({kind,label,verdict,findings,files,diff}){

  projectId:S.projectId,kind,label,verdict,findings,files,diff
 })});
 toast(data.duplicate?data.message:`Saved “${label}”. Open History — it updates live.`);
 return data;
}

 return `<div class="gx" id="gx"><div class="hud"><span class="live"><i class="dot on"></i><span id="lv">Watching 13 files…</span></span><div class="hb"><div class="hf" id="hf"></div></div><b id="hv">20%</b><span id="hc"></span><button type="button" class="chip" data-a="replay"><span>Replay</span></button></div><svg viewBox="0 0 800 520" role="group" aria-label="Demo project: which files depend on which"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--ac)"/></marker></defs>${rings}<g class="sw"><path d="M400 260L400 20A240 240 0 0 1 520 52Z" style="fill:var(--ac);opacity:.08"/><line x1="400" y1="260" x2="400" y2="20" style="stroke:var(--ac);stroke-opacity:.5;stroke-width:1.5"/></g>${edges}${nodes}</svg><p class="tip">Click a file to see what depends on it. Pick one with a glowing ring and rotate its key: watch the health climb.</p><div class="gcap" id="gcap" aria-live="polite"></div></div>`;

let es,poll;
function listenHistory(){
 if(es){es.close();es=null}
 if(poll){clearInterval(poll);poll=null}
 S.live=false;
 if(!S.health?.connected)return;
 const url='/api/stream?projectId='+encodeURIComponent(S.projectId);
 es=new EventSource(url);
 es.onmessage=async()=>{S.live=true;await loadHistory();if((location.hash||'').slice(1)==='history')route()};
 es.onerror=()=>{
  S.live=false;
  es.close();es=null;
  if(!poll)poll=setInterval(async()=>{await loadHistory();if((location.hash||'').slice(1)==='history')route()},3000);

}

document.addEventListener('pointermove',e=>{const g=$('#gx');if(!g||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const r=g.getBoundingClientRect(),inside=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;g.style.setProperty('--mx',inside?((e.clientX-r.left)/r.width-.5)*2:0);g.style.setProperty('--my',inside?((e.clientY-r.top)/r.height-.5)*2:0)});
(()=>{const T=['Watching 13 files…','Checking imports…','Looking for exposed keys…','Mapping the ripple…'];let i=0;setInterval(()=>{const el=$('#lv');if(el&&!$('#gx').classList.contains('win'))el.textContent=T[++i%T.length]},2400)})();
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.gn){S.gn=e.target.dataset.gn;applyGn();return}if(e.metaKey||e.ctrlKey||e.altKey||/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;const k=['code','findings','impact','diff','history'][+e.key-1];if(k)location.hash=k});
scan();
refreshHealth().then(async()=>{listenHistory();if(S.dir)await scanDir(false);route()});
route();

/* live background: a dot grid that ripples */
(()=>{
 const cv=document.getElementById('bg'),cx=cv.getContext('2d'),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
 let W,H,rip=[],mx=-999,my=-999,col='0,0,0',last=0,amb=0,mv=0,fr=0,raf=0,lx=0,ly=0;const G=34;
 const size=()=>{const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);if(RM)draw()};
 const color=()=>{const h=getComputedStyle(document.documentElement).getPropertyValue('--fg').trim().replace('#','');if(h.length===6)col=[0,2,4].map(i=>parseInt(h.substr(i,2),16)).join(',')};
 const spawn=(x,y,a)=>{if(rip.length>8)rip.shift();rip.push({x,y,r:0,a})};
 function draw(){
  cx.clearRect(0,0,W,H);
  for(const p of rip){cx.strokeStyle=`rgba(${col},${(p.a*.2).toFixed(3)})`;cx.lineWidth=1;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.2832);cx.stroke()}
  for(let x=G/2;x<W;x+=G)for(let y=G/2;y<H;y+=G){
   let w=0;for(const p of rip){const e=(Math.hypot(x-p.x,y-p.y)-p.r)/46;w+=p.a*Math.exp(-e*e)}
   const dm=Math.hypot(x-mx,y-my),s=dm<150?1-dm/150:0,a=Math.min(.85,.12+w*.55+s*.5);
   cx.fillStyle=`rgba(${col},${a.toFixed(3)})`;cx.beginPath();cx.arc(x,y,1+w*2.4+s*1.8,0,6.2832);cx.fill();
  }
 }
 function frame(t){
  const dt=Math.min(.05,(t-last)/1000||.016);last=t;
  if(++fr%90===0)color();
  rip.forEach(p=>{p.r+=dt*260;p.a*=Math.pow(.4,dt)});rip=rip.filter(p=>p.a>.04&&p.r<1500);
  if(t-amb>3800){amb=t;spawn(Math.random()*W,Math.random()*H,.5)}
  draw();raf=requestAnimationFrame(frame);
 }
 addEventListener('resize',size);
 addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;const n=performance.now();if(n-mv>500&&Math.hypot(mx-lx,my-ly)>80){mv=n;lx=mx;ly=my;if(!RM)spawn(mx,my,.28)}});
 addEventListener('pointerdown',e=>{if(!RM)spawn(e.clientX,e.clientY,.9)});
 document.addEventListener('pointerleave',()=>{mx=my=-999});
 document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelAnimationFrame(raf);else if(!RM){last=performance.now();raf=requestAnimationFrame(frame)}});
 new MutationObserver(color).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
 size();color();if(RM)draw();else raf=requestAnimationFrame(frame);
})();

/* F1 car cursor */
(()=>{
 if(!matchMedia('(pointer:fine)').matches)return;
 const car=document.getElementById('car'),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
 document.documentElement.classList.add('car');
 let x=0,y=0,tx=0,ty=0,a=0,vis=false;
 addEventListener('pointermove',e=>{tx=e.clientX;ty=e.clientY;if(!vis){x=tx;y=ty;vis=true;car.style.opacity=1}});
 document.documentElement.addEventListener('mouseleave',()=>{vis=false;car.style.opacity=0});
 addEventListener('pointerdown',()=>car.classList.add('rev'));
 addEventListener('pointerup',()=>car.classList.remove('rev'));
 document.addEventListener('mouseover',e=>car.classList.toggle('hot',!!e.target.closest('a,button,select,label,[data-a],[data-fn],[data-sf],[data-gn]')));
 let px=0,py=0,sm=0,last=performance.now();
 (function loop(t){
  const dt=Math.min(.05,(t-last)/1000||.016);last=t;
  const k=RM?1:1-Math.exp(-dt*12);
  px=x;py=y;x+=(tx-x)*k;y+=(ty-y)*k;
  const vx=(x-px)/dt,vy=(y-py)/dt,sp=Math.hypot(vx,vy);
  sm+=(sp-sm)*(1-Math.exp(-dt*8));
  if(!RM&&sp>50){let d=Math.atan2(vy,vx)-a;d=Math.atan2(Math.sin(d),Math.cos(d));a+=d*(1-Math.exp(-dt*9))}
  car.classList.toggle('run',!RM&&sm>(car.classList.contains('run')?40:90));
  car.style.setProperty('--ld',Math.max(.07,.24-sm/4000).toFixed(3)+'s');
  car.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${a.toFixed(3)}rad) translate(-17px,-16px)`;
  requestAnimationFrame(loop);
 })(performance.now());
})();
</script>
